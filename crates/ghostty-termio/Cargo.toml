[package]
name = "ghostty-termio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
ghostty-apprt.workspace = true
ghostty-config.workspace = true
ghostty-crash.workspace = true
ghostty-datastruct.workspace = true
ghostty-os.workspace = true
ghostty-renderer.workspace = true
ghostty-terminal.workspace = true
ghostty-vt.workspace = true
log = "0.4.34"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
nix = { version = "0.31.3", features = ["signal"] }
rustix = { version = "1.1.5", features = ["fs", "process", "pty", "termios", "stdio", "event", "pipe"] }

# ConPTY, pipes, process creation and waits (Zig: `pty.zig` WindowsPty,
# `Command.zig` startWindows, `termio/Exec.zig` Windows branches).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Termio forks/execs children and sets up ptys; unsafe is denied by default
# and only allowed on minimal, SAFETY-commented items.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
# Porting a low-level terminal emulator involves a lot of intentional
# numeric casts and long state-machine functions; these pedantic lints are
# noise for this codebase.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
match_same_arms = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
used_underscore_binding = "allow"
large_stack_arrays = "allow"
inline_always = "allow"

[dev-dependencies]
temp-env = "0.3.6"

[target.'cfg(unix)'.dev-dependencies]
zbus = "5.19.0"
rustix = { version = "1.1.5", features = ["process"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
