[package]
name = "ghostty-font"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tiny-skia = "0.12.0"
png = "0.18.1"
thiserror = "2.0.21"
log = "0.4.34"
ghostty-unicode.workspace = true
bitflags = "2.13.2"
ghostty-datastruct.workspace = true
ghostty-config.workspace = true
ghostty-terminal.workspace = true

# The C font libraries are unavailable on wasm32, where the web_canvas
# backend (browser Canvas API through JS imports) is used instead
# (Zig: `font/backend.zig` `Backend.default`).
[target.'cfg(not(any(target_arch = "wasm32", target_vendor = "apple")))'.dependencies]
yeslogic-fontconfig-sys = "6.0.1"

[target.'cfg(not(any(target_arch = "wasm32", target_vendor = "apple", windows)))'.dependencies]
freetype-sys = "0.23.0"
harfbuzz-sys = "0.8.0"

# Windows has no system freetype/harfbuzz to find via pkg-config (Zig builds
# them from source): build them from the bundled sources. Fontconfig (the
# default Zig backend there too, also built from source) must be provided
# by the Windows toolchain (vcpkg / MSYS2) when linking.
[target.'cfg(windows)'.dependencies]
freetype-sys = { version = "0.23.0", features = ["bundled"] }
harfbuzz-sys = { version = "0.8.0", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ghostty-os.workspace = true

# Apple targets use CoreText (`coretext` backend) by default; FreeType and
# HarfBuzz are only linked for the `coretext-freetype` / `coretext-harfbuzz`
# backends (see `build.rs` and the `[features]` table).
[target.'cfg(target_vendor = "apple")'.dependencies]
# Like upstream (which builds them from source) the bundled copies are used,
# so no system library is needed on macOS.
freetype-sys = { version = "0.23.0", optional = true, features = ["bundled"] }
harfbuzz-sys = { version = "0.8.0", optional = true, default-features = false, features = ["coretext", "bundled"] }
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-foundation = "0.3.2"

[features]
default = []
# CoreText for discovery, FreeType for rendering, HarfBuzz for shaping
# (Zig `-Dfont-backend=coretext_freetype`; Apple targets only).
coretext-freetype = ["dep:freetype-sys", "dep:harfbuzz-sys", "harfbuzz-sys/freetype"]
# CoreText for discovery and rendering, HarfBuzz for shaping
# (Zig `-Dfont-backend=coretext_harfbuzz`; Apple targets only).
coretext-harfbuzz = ["dep:harfbuzz-sys"]
# CoreText for discovery and rendering, no shaping
# (Zig `-Dfont-backend=coretext_noshape`; Apple targets only).
coretext-noshape = []

# This crate wraps the freetype / harfbuzz / fontconfig C libraries through
# their `-sys` crates; unsafe is denied by default and allowed on minimal,
# `// SAFETY:`-commented items only.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
match_same_arms = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
used_underscore_binding = "allow"
large_stack_arrays = "allow"
inline_always = "allow"

[dev-dependencies]
ghostty-vt.workspace = true
