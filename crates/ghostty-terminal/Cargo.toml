[package]
name = "ghostty-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
crossbeam-channel = "0.5.17"
flate2 = "1.1.10"
ghostty-datastruct.workspace = true
ghostty-unicode.workspace = true
ghostty-vt.workspace = true
log = "0.4.34"
png = "0.18.1"
thiserror = "2.0.21"

# C / POSIX-only dependencies are unavailable on wasm32 (Zig builds the wasm
# module without oniguruma, and kitty shared-memory images need POSIX shm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
onig = "6.5.3"
ghostty-onig.workspace = true

# POSIX shm is not available on Windows (Zig returns `UnsupportedMedium`).
[target.'cfg(not(any(target_arch = "wasm32", windows)))'.dependencies]
rustix = { version = "1.1.5", features = ["shm", "fs"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ghostty-os.workspace = true

[dev-dependencies]
ghostty-config.workspace = true

[lints]
workspace = true
