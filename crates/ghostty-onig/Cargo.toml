[package]
name = "ghostty-onig"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal safe wrapper for the Oniguruma match-param calls the `onig` crate does not expose"

[dependencies]
onig = "6.5.3"
onig_sys = "69.9.3"

# This crate exists solely to hold one tiny, SAFETY-commented FFI call
# (`onig_set_retry_limit_in_search_of_match_param`), which the `onig` crate
# does not expose. Everything else in the workspace keeps `unsafe_code`
# forbidden.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
# Porting a low-level terminal emulator involves a lot of intentional
# numeric casts and long state-machine functions; these pedantic lints are
# noise for this codebase.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
match_same_arms = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
used_underscore_binding = "allow"
large_stack_arrays = "allow"
inline_always = "allow"
