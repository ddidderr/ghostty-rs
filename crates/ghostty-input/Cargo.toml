[package]
name = "ghostty-input"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ghostty-vt.workspace = true
ghostty-os.workspace = true
ghostty-unicode.workspace = true
indexmap = "2.14.2"
thiserror = "2.0.21"

[build-dependencies]
ghostty-helpgen.workspace = true

# Same as `[workspace.lints]` except `unsafe_code` is denied instead of
# forbidden: the macOS Carbon keymap (`keymap_darwin.rs`) needs `unsafe` FFI.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
match_same_arms = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
used_underscore_binding = "allow"
large_stack_arrays = "allow"
inline_always = "allow"

[target.'cfg(target_vendor = "apple")'.dependencies]
log = "0.4.34"
objc2-core-foundation = "0.3.2"
